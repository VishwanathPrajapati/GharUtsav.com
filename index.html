<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>मेरा भारत AI असिस्टेंट</title>

    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: Arial, sans-serif; 
            margin: 0; 
            padding: 0; 
            background-color: #ffffff; 
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            flex: 1;
            background-color: #ffffff;
        }

        /* तिरंगा ऊपर की पट्टी */
        .top-banner {
            background: linear-gradient(to right, #ff9933 0%, #ff9933 33%, #ffffff 33%, #ffffff 66%, #128807 66%, #128807 100%);
            padding: 12px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid #000080;
        }

        .banner-title {
            font-size: 20px;
            font-weight: bold;
            color: #000080;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .change-name-btn {
            background-color: #000080;
            color: white;
            border: none;
            padding: 6px 12px;
            font-size: 14px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        /* पीली API Key वाली पट्टी */
        .api-section { 
            background-color: #fff9db; 
            padding: 10px 15px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            border-bottom: 1px solid #ccc;
            gap: 10px;
        }
        
        .api-label {
            font-size: 15px;
            font-weight: bold;
            color: #333333;
            white-space: nowrap;
        }

        .api-input-box {
            flex: 1;
            padding: 8px 10px;
            border: 1px solid #b0bec5;
            border-radius: 4px;
            font-size: 16px;
            background-color: #ffffff;
        }

        /* गहरा नीला 'सेव' बटन */
        .save-btn { 
            background-color: #000080; 
            color: white; 
            border: none; 
            padding: 8px 18px; 
            font-size: 16px; 
            border-radius: 4px; 
            cursor: pointer;
            font-weight: bold;
        }

        /* निर्माता क्रेडिट लाइन */
        .creator-text {
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            color: #444444;
            padding: 8px 0;
            background-color: #f9f9f9;
            margin: 0;
            border-bottom: 1px solid #e0e0e0;
        }

        /* मुख्य चैट विंडो */
        .chat-window { 
            flex: 1; 
            padding: 15px; 
            overflow-y: auto; 
            background-color: #ffffff; 
            display: flex; 
            flex-direction: column; 
            gap: 15px;
            height: 60vh;
        }

        .msg { 
            padding: 12px 16px; 
            border-radius: 14px; 
            max-width: 80%; 
            font-size: 16px; 
            line-height: 1.4;
        }
        
        .ai-msg { 
            background-color: #ffffff; 
            color: #000000; 
            align-self: flex-start; 
            border: 1px solid #e0e0e0;
        }
        
        .user-msg { 
            background-color: #000080; 
            color: #ffffff; 
            align-self: flex-end; 
        }

        /* निचला इनपुट हिस्सा */
        .input-section { 
            padding: 15px; 
            display: flex; 
            gap: 10px; 
            align-items: center;
            background-color: #ffffff;
            border-top: 1px solid #eaeaea;
        }

        .chat-input { 
            flex: 1; 
            padding: 12px 20px; 
            border: 1px solid #ccc; 
            border-radius: 25px; 
            font-size: 16px; 
            outline: none;
        }

        .send-btn { 
            background-color: #008000; 
            color: white; 
            border: none; 
            padding: 12px 24px; 
            font-size: 16px; 
            font-weight: bold;
            border-radius: 25px; 
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- तिरंगा ऊपर की पट्टी -->
        <div class="top-banner">
            <h2 class="banner-title">🇮🇳 मेरा भारत AI असिस्टेंट 🇮🇳</h2>
            <button id="changeNameBtn" class="change-name-btn">नाम बदलें</button>
        </div>
        
        <!-- पीली पट्टी -->
        <div class="api-section">
            <div class="api-label">🔑 Gemini API Key:</div>
            <input type="password" id="apiKeyInput" class="api-input-box" placeholder="..........................................">
            <button id="saveBtn" class="save-btn">सेव</button>
        </div>

        <!-- निर्माता क्रेडिट लाइन -->
        <div class="creator-text">इसके निर्माता सुलभ कुमार हैं</div>

        <!-- चैट विंडो -->
        <div id="chatWindow" class="chat-window"></div>

        <!-- निचला हिस्सा -->
        <div class="input-section">
            <input type="text" id="chatInput" class="chat-input" placeholder="यहाँ अपना सवाल लिखें...">
            <button id="sendBtn" class="send-btn">भेजें</button>
        </div>
    </div>

    <script>
        const apiKeyInput = document.getElementById('apiKeyInput');
        const saveBtn = document.getElementById('saveBtn');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const chatWindow = document.getElementById('chatWindow');
        const changeNameBtn = document.getElementById('changeNameBtn');

        let registeredName = "Sulabh kumar"; 

        window.addEventListener('load', () => {
            const savedName = localStorage.getItem('bharta_ai_user_name');
            const savedKey = localStorage.getItem('gemini_api_key');

            if (savedName) {
                registeredName = savedName;
            } else {
                localStorage.setItem('bharta_ai_user_name', registeredName);
            }

            if (savedKey) {
                apiKeyInput.value = savedKey;
            }

            showWelcomeMessage();
        });

        changeNameBtn.addEventListener('click', () => {
            const newName = prompt("अपना नया नाम लिखें:", registeredName);
            if (newName && newName.trim() !== "") {
                registeredName = newName.trim();
                localStorage.setItem('bharta_ai_user_name', registeredName);
                showWelcomeMessage();
            }
        });

        function showWelcomeMessage() {
            chatWindow.innerHTML = "";
            appendMessage('AI', `नमस्ते ${registeredName}, वेलकम टू माई एआई! प्रणाम! मैं आपका अपना भारतीय AI दोस्त हूँ। ऊपर अपनी नई चाबी पेस्ट करके 'सेव' दबाएं, फिर नीचे सवाल पूछें।`);
        }

        // नया सुपर-फास्ट सेव फंक्शन
        saveBtn.addEventListener('click', () => {
            const key = apiKeyInput.value.trim();
            if (!key) {
                alert("कृपया पहले सही API Key बॉक्स में डालें!");
                return;
            }
            localStorage.setItem('gemini_api_key', key);
            alert("API Key सफलतापूर्वक सेव हो गई है! 🎉");
        });

        // डायरेक्ट API फेच मेथड (बिना किसी लोडिंग एरर के)
        async function askGemini() {
            const userMessage = chatInput.value.trim();
            if (!userMessage) return;

            const savedKey = localStorage.getItem('gemini_api_key');
            if (!savedKey) {
                appendMessage('AI', "माफ करना भाई, कुछ गड़बड़ हो गई। ऊपर अपनी सही चाबी दोबारा डालकर 'सेव' बटन दबाएं!");
                return;
            }

            try {
                appendMessage('User', userMessage);
                chatInput.value = '';

                // बिना किसी बाहरी लाइब्रेरी के डायरेक्ट Google API को कॉल करना
                const url = `https://googleapis.com{savedKey}`;
                
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/center-box; charset=UTF-8' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: userMessage }] }] })
                });

                const data = await response.json();
                
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    appendMessage('AI', data.candidates[0].content.parts[0].text);
                } else {
                    appendMessage('AI', "माफ करना भाई, कुछ गड़बड़ हो गई। ऊपर अपनी सही चाबी दोबारा डालकर 'सेव' बटन दबाएं!");
                }

            } catch (error) {
                appendMessage('AI', "माफ करना भाई, कुछ गड़बड़ हो गई। ऊपर अपनी सही चाबी दोबारा डालकर 'सेव' बटन दबाएं!");
            }
        }

        sendBtn.addEventListener('click', askGemini);
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') askGemini();
        });

        function appendMessage(sender, text) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('msg');
            if (sender === 'AI') {
                msgDiv.classList.add('ai-msg');
                msgDiv.innerHTML = text;
            } else {
                msgDiv.classList.add('user-msg');
                msgDiv.innerHTML = text;
            }
            chatWindow.appendChild(msgDiv);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }
