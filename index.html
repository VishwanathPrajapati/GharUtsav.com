<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>भारत AI</title>
    
    <!-- Gemini API की लेटेस्ट लाइब्रेरी -->
    <script type="importmap">
      {
        "imports": {
          "@google/genai": "https://esm.run"
        }
      }
    </script>

    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f4f7f6; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        
        /* रजिस्ट्रेशन / नाम पूछने वाला पॉपअप */
        .name-popup { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .popup-box { background: white; padding: 30px; border-radius: 10px; text-align: center; max-width: 400px; width: 90%; }
        
        /* इनपुट और बटन की स्टाइल */
        input[type="text"], input[type="password"] { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #0056b3; }
        
        /* चैट विंडो */
        .chat-window { height: 300px; border: 1px solid #ddd; padding: 10px; overflow-y: auto; margin-bottom: 15px; background: #fafafa; border-radius: 5px; }
        .msg { margin-bottom: 10px; padding: 8px 12px; border-radius: 5px; max-width: 80%; }
        .ai-msg { background-color: #e2f0d9; align-self: flex-start; }
        .user-msg { background-color: #007bff; color: white; margin-left: auto; text-align: right; }
        
        .api-section { background: #eee; padding: 10px; border-radius: 5px; margin-bottom: 15px; }
        .flex-box { display: flex; gap: 10px; }
        .flex-box input { margin: 0; }
        .flex-box button { width: auto; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- 1. पहली बार आने वालों के लिए रजिस्ट्रेशन स्क्रीन -->
    <div id="namePopup" class="name-popup hidden">
        <div class="popup-box">
            <h2>भारत AI में आपका स्वागत है!</h2>
            <p>कृपया यहाँ अपना नाम लिखकर रजिस्टर करें:</p>
            <input type="text" id="userNameInput" placeholder="अपना नाम यहाँ लिखें...">
            <button id="startBtn">रजिस्टर करें और चैट शुरू करें</button>
        </div>
    </div>

    <!-- 2. मुख्य चैट स्क्रीन -->
    <div class="container">
        <h2>भारत AI 🤖</h2>
        
        <!-- API Key सेक्शन -->
        <div class="api-section">
            <label for="apiKeyInput"><b>Gemini API Key:</b></label>
            <div class="flex-box">
                <input type="password" id="apiKeyInput" placeholder="अपनी API चाबी यहाँ पेस्ट करें...">
                <button id="saveBtn">सेव</button>
            </div>
        </div>

        <!-- चैट विंडो -->
        <div id="chatWindow" class="chat-window">
            <!-- यहाँ स्वागत संदेश अपने आप आएगा -->
        </div>

        <!-- सवाल पूछने की जगह -->
        <div class="flex-box">
            <input type="text" id="chatInput" placeholder="यहाँ अपना सवाल लिखें...">
            <button id="sendBtn" style="background-color: #28a745;">भेजें</button>
        </div>
    </div>

    <script type="module">
        import { GoogleGenAI } from '@google/genai';

        const namePopup = document.getElementById('namePopup');
        const userNameInput = document.getElementById('userNameInput');
        const startBtn = document.getElementById('startBtn');
        
        const apiKeyInput = document.getElementById('apiKeyInput');
        const saveBtn = document.getElementById('saveBtn');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const chatWindow = document.getElementById('chatWindow');

        let ai = null;
        let registeredName = "";

        // पेज लोड होते ही चेक करेंगे कि यूजर पहले से रजिस्टर्ड है या नहीं
        window.addEventListener('load', () => {
            // ब्राउज़र मेमोरी से नाम और चाबी लोड करना
            const savedName = localStorage.getItem('bharta_ai_user_name');
            const savedKey = localStorage.getItem('gemini_api_key');

            if (savedKey) {
                apiKeyInput.value = savedKey;
                ai = new GoogleGenAI({ apiKey: savedKey });
            }

            if (savedName) {
                // अगर नाम पहले से सेव है, तो सीधे स्वागत संदेश दिखाएं
                registeredName = savedName;
                showWelcomeMessage();
            } else {
                // अगर नाम सेव नहीं है, तो रजिस्ट्रेशन पॉपअप दिखाएं
                namePopup.classList.remove('hidden');
            }
        });

        // पहली बार नाम रजिस्टर करने का फंक्शन
        startBtn.addEventListener('click', () => {
            const name = userNameInput.value.trim();
            if (!name) {
                alert("कृपया रजिस्ट्रेशन के लिए अपना नाम जरूर डालें!");
                return;
            }
            
            // नाम को हमेशा के लिए ब्राउज़र की मेमोरी में रजिस्टर (सेव) करें
            localStorage.setItem('bharta_ai_user_name', name);
            registeredName = name;
            
            namePopup.classList.add('hidden'); // पॉपअप छुपाएं
            showWelcomeMessage(); // स्वागत संदेश दिखाएं
        });

        // एंटर बटन दबाकर भी रजिस्टर हो सके
        userNameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') startBtn.click();
        });

        // आपके द्वारा बताया गया सटीक स्वागत संदेश दिखाने का फंक्शन
        function showWelcomeMessage() {
            appendMessage('AI', `नमस्ते ${registeredName}, भारत AI पर आपका स्वागत है। आप इसमें कुछ भी सवाल पूछ सकते हैं।`);
        }

        // API Key सेव करने का फंक्शन
        saveBtn.addEventListener('click', () => {
            const key = apiKeyInput.value.trim();
            if (!key) {
                alert("कृपया सही API Key डालें!");
                return;
            }
            localStorage.setItem('gemini_api_key', key);
            ai = new GoogleGenAI({ apiKey: key });
            alert("API Key सफलतापूर्वक सेव हो गई है!");
        });

        // सवाल पूछने और जवाब देने का फंक्शन
        async function askGemini() {
            const userMessage = chatInput.value.trim();
            if (!userMessage) return;

            if (!ai) {
                appendMessage('AI', "माफ करना भाई, कुछ गड़बड़ हो गई। ऊपर अपनी सही चाबी दोबारा डालकर 'सेव' बटन दबाएं!");
                return;
            }

            try {
                appendMessage('User', userMessage);
                chatInput.value = '';

                const response = await ai.models.generateContent({
                    model: 'gemini-1.5-flash',
                    contents: userMessage,
                });

                appendMessage('AI', response.text);

            } catch (error) {
                console.error("Error:", error);
                appendMessage('AI', "माफ करना भाई, कुछ गड़बड़ हो गई। ऊपर अपनी सही चाबी दोबारा डालकर 'सेव' बटन दबाएं!");
            }
        }

        sendBtn.addEventListener('click', askGemini);
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') askGemini();
        });

        // चैट स्क्रीन पर मैसेज जोड़ने का फंक्शन
        function appendMessage(sender, text) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('msg');
            if (sender === 'AI') {
                msgDiv.classList.add('ai-msg');
                msgDiv.innerHTML = `<b>भारत AI:</b> ${text}`;
            } else {
                msgDiv.classList.add('user-msg');
                msgDiv.innerHTML = `<b>आप (${registeredName}):</b> ${text}`;
            }
            chatWindow.appendChild(msgDiv);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }
    </script>
</body>
</html>
