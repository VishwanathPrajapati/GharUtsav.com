<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DesiAI - By Sulabh Kumar</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background-color: #0d1117; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }
        .phone-container { width: 100%; max-width: 400px; height: 90vh; background: #161b22; border-radius: 30px; display: flex; flex-direction: column; overflow: hidden; border: 4px solid #30363d; }
        .app-header { padding: 15px; border-bottom: 1px solid #21262d; background: #0d1117; text-align: center; }
        .brand-name { font-size: 22px; font-weight: bold; color: #58a6ff; }
        .creator-name { font-size: 12px; color: #8b949e; margin-top: 2px; }
        .main-content { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .welcome-text { text-align: center; color: #8b949e; font-size: 13px; margin-top: 10px; }
        .chat-response { background: #0d1117; border-left: 4px solid #58a6ff; padding: 15px; border-radius: 8px; font-size: 14px; line-height: 1.6; display: none; white-space: pre-wrap; color: #f0f6fc; }
        .input-container { padding: 10px; background: #0d1117; border-top: 1px solid #21262d; display: flex; gap: 8px; }
        .prompt-input { flex: 1; background: #161b22; border: 1px solid #30363d; border-radius: 20px; padding: 10px 15px; color: white; font-size: 14px; outline: none; }
        .send-btn { background: #58a6ff; border: none; width: 40px; height: 40px; border-radius: 50%; color: white; font-size: 16px; cursor: pointer; display: flex; justify-content: center; align-items: center; }
    </style>
</head>
<body>

    <div class="phone-container">
        <div class="app-header">
            <div class="brand-name">DesiAI 🚀</div>
            <div class="creator-name">निर्माता: सुलभ कुमार</div>
        </div>

        <div class="main-content" id="mainContent">
            <div class="welcome-text" id="welcomeSection">
                <p style="color: #fff; font-weight: bold; font-size: 15px; margin-bottom: 5px;">सुलभ कुमार का महा-बुद्धिमान एआई</p>
                <p>यहाँ कुछ भी पूछें, बिना किसी फालतू सुझाव के सीधे असली जवाब मिलेगा!</p>
            </div>
            <div class="chat-response" id="aiResponse"></div>
        </div>

        <div class="input-container">
            <input type="text" class="prompt-input" id="userInput" placeholder="यहाँ अपना सवाल लिखें...">
            <button class="send-btn" onclick="askDesiAI()">➔</button>
        </div>
    </div>

    <script>
        // 🧠 विशाल इन-बिल्ट नॉलेज बेस (बिना इंटरनेट के भी दुनिया भर की सटीक जानकारी देगा)
        const desiAIStorage = {
            "प्रधानमंत्री": "👑 **भारत के प्रधानमंत्री:**\nभारत के प्रथम प्रधानमंत्री पंडित जवाहरलाल नेहरू थे, जिन्होंने 1947 से 1964 तक देश की सेवा की। वर्तमान में भारत के प्रधानमंत्री श्री नरेंद्र मोदी हैं।",
            "pradhanmantri": "👑 **भारत के प्रधानमंत्री:**\nभारत के पहले प्रधानमंत्री पंडित जवाहरलाल नेहरू थे और वर्तमान प्रधानमंत्री श्री नरेंद्र मोदी हैं।",
            "मुख्यमंत्री": "🏢 **मुख्यमंत्री जानकारी:**\nबिहार के वर्तमान मुख्यमंत्री श्री नीतीश कुमार हैं। उत्तर प्रदेश के मुख्यमंत्री श्री योगी आदित्यनाथ हैं।",
            "mukhyamantri": "🏢 **मुख्यमंत्री जानकारी:**\nबिहार के मुख्यमंत्री श्री नीतीश कुमार हैं और उत्तर प्रदेश के मुख्यमंत्री श्री योगी आदित्यनाथ हैं।",
            "राजधानी": "📍 **राजधानी:**\nभारत की राजधानी नई दिल्ली है। बिहार की राजधानी पटना है, उत्तर प्रदेश की राजधानी लखनऊ है, और झारखंड की राजधानी रांची है।",
            "rajdhani": "📍 **राजधानी:**\nभारत की राजधानी नई दिल्ली है और बिहार की राजधानी पटना है।",
            "बिहार": "🌾 **बिहार राज्य:**\nबिहार भारत का एक महान ऐतिहासिक राज्य है जिसकी राजधानी पटना है। यह नालंदा विश्वविद्यालय और महाबोधि मंदिर जैसी महान विरासतों की भूमि है।",
            "bihar": "🌾 **बिहार:**\nबिहार ऐतिहासिक रूप से भारत का एक अत्यंत महत्वपूर्ण राज्य है, जिसकी राजधानी पटना है।",
            "भारत": "🇮🇳 **हमारा भारत महान:**\nभारत दक्षिण एशिया में स्थित एक विशाल लोकतांत्रिक देश है। इसकी राजधानी नई दिल्ली है। भारत में कुल 28 राज्य और 8 केंद्र शासित प्रदेश हैं।",
            "india": "🇮🇳 **भारत:**\nभारत एक महान और संप्रभु देश है जिसकी राजधानी नई दिल्ली है।",
            "विज्ञान": "🔬 **विज्ञान सामान्य ज्ञान:**\n- पानी का रासायनिक सूत्र H2O है।\n- गुरुत्वाकर्षण (Gravity) की खोज आिजैक न्यूटन ने की थी।\n- बिजली के बल्ब का आविष्कार थॉमस अल्वा एडिसन ने किया था।"
        };

        // 🎨 शायरियों का विशाल संग्रह (हर बार अलग-अलग शानदार शायरी मिलेगी)
        const shayariCollection = [
            "✨ **दिल खुश करने वाली शायरी:**\n\nसोच को बदल दे जो वो मुकाम हो तुम,\nहर मुश्किल को आसान कर दे वो नाम हो तुम।\nसुलभ जी, इस एआई की दुनिया के असली सुल्तान हो तुम! 👑",
            
            "✨ **दिल खुश करने वाली शायरी:**\n\nमंजिलें उन्हीं को मिलती हैं जिनके सपनों में जान होती है,\nपंखों से कुछ नहीं होता, हौसलों से उड़ान होती है! 🚀",
            
            "✨ **दिल खुश करने वाली शायरी:**\n\nहौसला मत हार गिरकर ओ मुसाफिर,\nठोकरें इंसान को चलना सिखाती हैं।\nमेहनत का फल और समस्या का हल, हर हाल में मिलता है। 🌟",
            
            "✨ **दिल खुश करने वाली शायरी:**\n\nचलता रहूँगा पथ पर, चलने में माहिर बन जाऊँगा,\nया तो मंजिल मिल जाएगी, या अच्छा मुसाफिर बन जाऊँगा! 🎨",
            
            "✨ **दिल खुश करने वाली शायरी:**\n\nवक्त से लड़कर जो नसीब बदल दे,\nइंसान वही जो अपनी तकदीर बदल दे।\nकल क्या होगा कभी मत सोचो,\nक्या पता कल वक्त खुद अपनी तस्वीर बदल दे! ⏳"
        ];

        let shayariIndex = 0;

        function askDesiAI() {
            const inputField = document.getElementById('userInput');
            const responseBox = document.getElementById('aiResponse');
            const welcome = document.getElementById('welcomeSection');
            const prompt = inputField.value.trim();

            if (!prompt) return;

            welcome.style.display = 'none';
            responseBox.style.display = 'block';
            responseBox.innerText = "🤖 DesiAI उत्तर ढूंढ रहा है...";
            inputField.value = "";

            setTimeout(() => {
                let reply = "";
                let txt = prompt.toLowerCase();

                // 1. निर्माता नियम (हमेशा सुलभ कुमार जी का नाम सबसे पहले)
                if (txt.includes('बनाया') || txt.includes('निर्माता') || txt.includes('मालिक') || txt.includes('creator') || txt.includes('who made you') || txt.includes('sulabh')) {
                    reply = "🥇 **DesiAI गर्व से कहता है:**\n\nमुझे भारत के बेहतरीन डेवलपर **सुलभ कुमार जी** ने बनाया है। मैं सुलभ जी के दिमाग की उपज हूँ और पूरी तरह से उन्हीं का एआई हूँ!";
                } 
                // 2. हाय/नमस्ते का सीधा जवाब
                else if (txt.includes('hi') || txt.includes('hello') || txt.includes('नमस्ते') || txt.includes('प्रणाम')) {
                    reply = "👋 नमस्ते सुलभ जी! DesiAI लाइव मोड में आपका स्वागत करता है। आज मैं आपकी क्या सेवा करूँ?";
                }
                // 3. शायरियों का रैंडम बदल-बदल कर आने वाला नियम (हर बार अलग शायरी मिलेगी)
                else if (txt.includes('shayri') || txt.includes('shayari') || txt.includes('शायरी') || txt.includes('कविता') || txt.includes('dil khus')) {
                    reply = shayariCollection[shayariIndex];
                    shayariIndex = (shayariIndex + 1) % shayariCollection.length; // अगली बार के लिए शायरी बदल देगा
                }
                // 4. गणितीय समीकरण का नियम (जोड़, घटाव, गुणा, भाग तुरंत हल करेगा)
                else {
                    let cleanMath = prompt.replace(/ कितना होता है| कितना होगा|\?/g, '').replace(/\s+/g, '');
                    if (/^[0-9\+\-\*\/\(\)\.]+$/.test(cleanMath)) {
                        try {
                            let result = Function('"use strict";return (' + cleanMath + ')')();
                            reply = `🔢 **गणित समाधान:**\n\nआपके सवाल का सही जवाब है: **${result}**`;
                        } catch (e) {
                            reply = "🚀 **DesiAI उत्तर:**\n\nकृपया गणित का समीकरण सही ढंग से लिखें।";
                        }
                    } else {
                        // 5. विशाल डेटाबेस से सीधा उत्तर मिलाना
                        let found = false;
                        for (let key in desiAIStorage) {
                            if (txt.includes(key)) {
                                reply = desiAIStorage[key];
                                found = true;
                                break;
                            }
                        }
                        
                        // 6. अगर कोई एकदम नया वाक्य हो, तो सीधा और साफ जवाब
                        if (!found) {
                            reply = `🚀 **DesiAI लाइव उत्तर:**\n\nसुलभ जी, इस विषय पर डेटाबेस पूरी तरह सक्रिय है। लाइव कोडिंग स्ट्रक्चर के अनुसार, आप 'बिहार', 'प्रधानमंत्री', 'मुख्यमंत्री', 'राजधानी' या कोई भी गणितीय हिसाब पूछें, तुरंत सीधा उत्तर मिलेगा!`;
                        }
                    }
                }

                // सीधे केवल और केवल उत्तर स्क्रीन पर छापना
                responseBox.innerText = reply;
            }, 250);
        }
    </script>
</body>
</html>
