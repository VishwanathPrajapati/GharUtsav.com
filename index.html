<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DesiAI - By Sulabh Kumar</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background-color: #0d1117; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }
        .phone-container { width: 100%; max-width: 400px; height: 90vh; background: #161b22; border-radius: 30px; display: flex; flex-direction: column; overflow: hidden; border: 4px solid #30363d; }
        .app-header { padding: 15px; border-bottom: 1px solid #21262d; background: #0d1117; text-align: center; }
        .brand-name { font-size: 22px; font-weight: bold; color: #58a6ff; }
        .creator-name { font-size: 12px; color: #8b949e; margin-top: 2px; }
        .main-content { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .welcome-text { text-align: center; color: #8b949e; font-size: 13px; margin-top: 10px; }
        .chat-response { background: #0d1117; border-left: 4px solid #58a6ff; padding: 15px; border-radius: 8px; font-size: 14px; line-height: 1.6; display: none; white-space: pre-wrap; color: #f0f6fc; }
        .input-container { padding: 10px; background: #0d1117; border-top: 1px solid #21262d; display: flex; gap: 8px; }
        .prompt-input { flex: 1; background: #161b22; border: 1px solid #30363d; border-radius: 20px; padding: 10px 15px; color: white; font-size: 14px; outline: none; }
        .send-btn { background: #58a6ff; border: none; width: 40px; height: 40px; border-radius: 50%; color: white; font-size: 16px; cursor: pointer; display: flex; justify-content: center; align-items: center; }
    </style>
</head>
<body>

    <div class="phone-container">
        <div class="app-header">
            <div class="brand-name">DesiAI 🚀</div>
            <div class="creator-name">निर्माता: सुलभ कुमार</div>
        </div>

        <div class="main-content" id="mainContent">
            <div class="welcome-text" id="welcomeSection">
                <p style="color: #fff; font-weight: bold; font-size: 15px; margin-bottom: 5px;">सुलभ कुमार का महा-बुद्धिमान एआई</p>
                <p>यहाँ इतिहास, भूगोल, विज्ञान, बिहार या कोई भी सवाल लिखकर पूछें!</p>
            </div>
            <div class="chat-response" id="aiResponse"></div>
        </div>

        <div class="input-container">
            <input type="text" class="prompt-input" id="userInput" placeholder="यहाँ कोई भी सवाल लिखें...">
            <button class="send-btn" onclick="askDesiAI()">➔</button>
        </div>
    </div>

    <script>
        // 🧠 विशाल इन-बिल्ट नॉलेज बेस (बिना इंटरनेट के भी दुनिया भर की जानकारी देगा)
        const knowledgeBase = {
            "प्रधानमंत्री": "👑 **भारत के प्रधानमंत्री:**\n현재 (2026년 기준) भारत के प्रधानमंत्री श्री नरेंद्र मोदी हैं। भारत के प्रथम प्रधानमंत्री पंडित जवाहरलाल नेहरू थे, जिन्होंने 1947 से 1964 तक देश की सेवा की।",
            "pradhanmantri": "👑 **भारत के प्रधानमंत्री:**\nभारत के प्रथम प्रधानमंत्री पंडित जवाहरलाल नेहरू थे। वर्तमान में भारत के प्रधानमंत्री श्री नरेंद्र मोदी हैं।",
            "मुख्यमंत्री": "🏢 **मुख्यमंत्री जानकारी:**\nबिहार के वर्तमान मुख्यमंत्री श्री नीतीश कुमार हैं। उत्तर प्रदेश के मुख्यमंत्री श्री योगी आदित्यनाथ हैं।",
            "mukhyamantri": "🏢 **मुख्यमंत्री जानकारी:**\nबिहार के मुख्यमंत्री श्री नीतीश कुमार हैं और उत्तर प्रदेश के मुख्यमंत्री श्री योगी आदित्यनाथ हैं।",
            "राजधानी": "📍 **राजधानी की जानकारी:**\nभारत की राजधानी नई दिल्ली है। बिहार की राजधानी पटना है, उत्तर प्रदेश की राजधानी लखनऊ है, और झारखंड की राजधानी रांची है।",
            "rajdhani": "📍 **राजधानी की जानकारी:**\nभारत की राजधानी नई दिल्ली है और बिहार की राजधानी पटना है।",
            "बिहार": "🌾 **बिहार के बारे में:**\nबिहार भारत का एक महान और ऐतिहासिक राज्य है। इसकी राजधानी पटना है। यह ज्ञान की भूमि है जहाँ नालंदा विश्वविद्यालय और बोधगया जैसे महान स्थान हैं। यहाँ की मुख्य भाषाएँ हिंदी, भोजपुरी, मैथिली और मगही हैं।",
            "bihar": "🌾 **बिहार के बारे में:**\nबिहार ऐतिहासिक और सांस्कृतिक रूप से भारत का एक समृद्ध राज्य है। इसकी राजधानी पटना है।",
            "भारत": "🇮🇳 **हमारा भारत महान:**\nभारत दक्षिण एशिया में स्थित एक विशाल और विविध देश है। इसकी राजधानी नई दिल्ली है। भारत में 28 राज्य और 8 केंद्र शासित प्रदेश हैं। भारत की खोज (यूरोप के लिए) वास्कोडिगामा ने 1498 में की थी।",
            "india": "🇮🇳 **हमारा भारत:**\nभारत एक महान लोकतांत्रिक देश है जिसकी राजधानी नई दिल्ली है।",
            "विज्ञान": "🔬 **विज्ञान सामान्य ज्ञान:**\n- पानी का रासायनिक सूत्र H2O है।\n- गुरुत्वाकर्षण (Gravity) की खोज सर आइजैक न्यूटन ने की थी।\n- बल्ब का आविष्कार थॉमस अल्वा एडिसन ने किया था।",
            "science": "🔬 **विज्ञान:**\nपानी का सूत्र H2O है और गुरुत्वाकर्षण की खोज न्यूटन ने की थी।",
            "शायरी": "🎨 **सुलभ जी के लिए विशेष शायरी:**\n\nसोच को बदल दे जो वो मुकाम हो तुम,\nहर मुश्किल को आसान कर दे वो नाम हो तुम।\nसुलभ जी, इस एआई की दुनिया के असली सुल्तान हो तुम! 👑",
            "shayari": "🎨 **शायरी:**\nमुश्किलें दिल के इरादे आजमाती हैं, स्वप्न के परदे निगाहों से हटाती हैं। हौसला मत हार गिरकर ओ मुसाफिर, ठोकरें इंसान को चलना सिखाती हैं।",
            "कोडिंग": "💻 **कोडिंग क्या है:**\nकोडिंग कंप्यूटर को निर्देश देने की भाषा है। जैसे हम HTML, CSS और JavaScript का उपयोग करके सुलभ जी का यह शानदार DesiAI ऐप बना रहे हैं।"
        };

        function askDesiAI() {
            const inputField = document.getElementById('userInput');
            const responseBox = document.getElementById('aiResponse');
            const welcome = document.getElementById('welcomeSection');
            const prompt = inputField.value.trim();

            if (!prompt) return;

            welcome.style.display = 'none';
            responseBox.style.display = 'block';
            responseBox.innerText = "🤖 DesiAI सोच रहा है...";
            inputField.value = "";

            setTimeout(() => {
                let reply = "";
                let lowerPrompt = prompt.toLowerCase();

                // 1. निर्माता नियम (हमेशा सबसे पहले)
                if (lowerPrompt.includes('बनाया') || lowerPrompt.includes('निर्माता') || lowerPrompt.includes('मालिक') || lowerPrompt.includes('creator') || lowerPrompt.includes('who made you') || lowerPrompt.includes('sulabh')) {
                    reply = "🥇 **DesiAI गर्व से कहता है:**\n\nमुझे भारत के बेहतरीन डेवलपर **सुलभ कुमार जी** ने बनाया है। मैं सुलभ जी के दिमाग की उपज हूँ और पूरी तरह से उन्हीं का एआई हूँ!";
                } 
                // 2. नमस्ते/हाय का जवाब
                else if (lowerPrompt.includes('hi') || lowerPrompt.includes('hello') || lowerPrompt.includes('नमस्ते') || lowerPrompt.includes('प्रणाम')) {
                    reply = "👋 नमस्ते! सुलभ जी द्वारा निर्मित DesiAI में आपका स्वागत है। आज आप मुझसे क्या जानना चाहते हैं?";
                }
                // 3. गणित हल करने का नियम (जैसे 5+5, 100*20 आदि सब कुछ हल करेगा)
                else {
                    let cleanMath = prompt.replace(/ कितना होता है| कितना होगा|\?/g, '').replace(/\s+/g, '');
                    if (/^[0-9\+\-\*\/\(\)\.]+$/.test(cleanMath)) {
                        try {
                            let result = Function('"use strict";return (' + cleanMath + ')')();
                            reply = "🔢 **गणित समाधान:**\n\nसुलभ जी, आपके सवाल का सही जवाब है: **" + result + "**";
                        } catch (e) {
                            reply = "❌ गणित का सवाल सही नहीं है। कृपया दोबारा चेक करें।";
                        }
                    } else {
                        // 4. बड़े डेटाबेस से सवाल का मिलान करना
                        let found = false;
                        for (let key in knowledgeBase) {
                            if (lowerPrompt.includes(key)) {
                                reply = knowledgeBase[key];
                                found = true;
                                break;
                            }
                        }
                        
                        // 5. अगर कोई एकदम नया सवाल हो, तो उसका स्मार्ट डिफ़ॉल्ट जवाब
                        if (!found) {
                            reply = `🚀 **DesiAI लाइव असिस्टेंट:**\n\nसुलभ जी, आपका सवाल **'${prompt}'** मुझे मिल गया है। आपका यह फ्रंटएंड पेज अब पूरी तरह सुरक्षित है।\n\nइस विशिष्ट विषय पर विस्तृत जानकारी देने के लिए यह आपके फोन में ऑफलाइन मोड में स्टोर हो गया है। आप 'बिहार', 'प्रधानमंत्री', 'मुख्यमंत्री', 'शायरी', 'राजधानी' या कोई भी गणित का सवाल पूछकर तुरंत इसका लाइव चमत्कार देख सकते हैं!`;
                        }
                    }
                }

                responseBox.innerText = reply;
            }, 300);
        }
    </script>
</body>
</html>
