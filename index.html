<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DesiAI - भारत का अपना एआई</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .phone-container {
            width: 100%;
            max-width: 100vw;
            height: 100vh;
            background: #0d1117;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .app-header {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #21262d;
            background-color: #161b22;
        }

        .brand-section {
            display: flex;
            flex-direction: column;
        }

        .brand-name {
            font-size: 24px;
            font-weight: bold;
            background: linear-gradient(45deg, #58a6ff, #bc8cff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .creator-name {
            font-size: 11px;
            color: #8b949e;
            margin-top: 2px;
            font-style: italic;
        }

        .status-badge {
            background-color: #238636;
            color: white;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }

        .main-content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .features-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 10px;
        }

        .feature-card {
            background-color: #1f242c;
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 15px;
            text-align: left;
            cursor: pointer;
        }

        .feature-icon {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .feature-title {
            font-size: 14px;
            font-weight: 600;
            color: #f0f6fc;
        }

        .feature-desc {
            font-size: 11px;
            color: #8b949e;
        }

        .chat-response {
            background-color: #161b22;
            border-left: 4px solid #bc8cff;
            padding: 15px;
            border-radius: 0 12px 12px 0;
            font-size: 14px;
            line-height: 1.6;
            display: none;
            white-space: pre-wrap;
        }

        .input-container {
            padding: 15px;
            background-color: #161b22;
            border-top: 1px solid #21262d;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .prompt-input {
            flex: 1;
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 25px;
            padding: 12px 20px;
            color: white;
            font-size: 14px;
            outline: none;
        }

        .send-btn {
            background: linear-gradient(135deg, #bc8cff, #8957e5);
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            color: white;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>

    <div class="phone-container">
        <!-- शीर्ष हेडर निर्माता के नाम के साथ -->
        <div class="app-header">
            <div class="brand-section">
                <div class="brand-name">DesiAI 🚀</div>
                <div class="creator-name">By Sulabh Kumar</div>
            </div>
            <div class="status-badge">स्मार्ट मोड एक्टिव</div>
        </div>

        <div class="main-content" id="mainContent">
            <!-- स्वागत संदेश निर्माता के नाम के साथ -->
            <div id="welcomeSection" style="text-align: center; margin-bottom: 10px;">
                <p style="color: #f0f6fc; font-size: 15px; font-weight: 600; margin-bottom: 5px;">सुलभ कुमार द्वारा निर्मित भारत का अपना एआई</p>
                <p style="color: #8b949e; font-size: 13px;">नमस्ते! मैं आपकी सेवा में हाजिर हूँ। नीचे कुछ भी टाइप करके पूछें!</p>
            </div>
            
            <div class="features-grid" id="featGrid">
                <div class="feature-card" onclick="setInput('भोजपुरी में बताओ भारत के बारे में')">
                    <div class="feature-icon">🗣️</div>
                    <div class="feature-title">देसी बोली</div>
                    <div class="feature-desc">लोकल टोन में बात करें।</div>
                </div>
                <div class="feature-card" onclick="setInput('पीएम किसान योजना क्या है?')">
                    <div class="feature-icon">📄</div>
                    <div class="feature-title">सरकारी योजना</div>
                    <div class="feature-desc">सरकारी योजनाओं की जानकारी।</div>
                </div>
            </div>

            <div class="chat-response" id="aiResponse"></div>
        </div>

        <div class="input-container">
            <input type="text" class="prompt-input" id="userInput" placeholder="अपनी भाषा में कुछ भी पूछें...">
            <button class="send-btn" onclick="askGeminiAI()">➔</button>
        </div>
    </div>

    <script>
        // यहाँ पर अपनी Google Gemini API Key डालें (लाइन 152)
        const GEMINI_API_KEY = "यहाँ_अपनी_API_KEY_पेस्ट_करें"; 

        // जब कोई एआई से पूछे कि तुम्हें किसने बनाया है, तो वह सुलभ कुमार का नाम ही बताएगा
        const CREATOR_PROMPT_INJECTION = " (महत्वपूर्ण निर्देश: आपका नाम DesiAI है और आपके निर्माता/बनाने वाले सुलभ कुमार हैं। यदि यूजर आपके निर्माता या क्रिएटर के बारे में पूछे, तो गर्व से सुलभ कुमार का नाम बताएं। कृपया शुद्ध और सरल भारतीय भाषा या हिंदी में जवाब दें)";

        function setInput(text) {
            document.getElementById('userInput').value = text;
        }

        async function askGeminiAI() {
            const inputField = document.getElementById('userInput');
            const responseBox = document.getElementById('aiResponse');
            const prompt = inputField.value.trim();

            if (!prompt) return;

            // स्क्रीन से पुरानी चीजें हटाना
            document.getElementById('featGrid').style.display = 'none';
            document.getElementById('welcomeSection').style.display = 'none';
            responseBox.style.display = 'block';
            responseBox.innerText = "🤖 DesiAI सोच रहा है...";
            inputField.value = "";

            try {
                // गूगल जेमिनी एआई को संदेश भेजना
                const response = await fetch(`https://googleapis.com{GEMINI_API_KEY}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt + CREATOR_PROMPT_INJECTION }] }]
                    })
                });

                const data = await response.json();
                
                // एआई का जवाब स्क्रीन पर दिखाना
                const aiText = data.candidates[0].content.parts[0].text;
                responseBox.innerText = aiText;

            } catch (error) {
                responseBox.innerText = "❌ माफ़ कीजिये सुलभ जी, अभी जवाब देने में कुछ दिक्कत आ रही है। कृपया कोड की लाइन 152 में अपनी सही API Key चेक करें।";
                console.error(error);
            }
        }
    </script>
</body>
</html>
