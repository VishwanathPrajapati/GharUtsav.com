<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DesiAI - By Sulabh Kumar</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background-color: #0d1117; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }
        .phone-container { width: 100%; max-width: 400px; height: 90vh; background: #161b22; border-radius: 30px; display: flex; flex-direction: column; overflow: hidden; border: 4px solid #30363d; }
        .app-header { padding: 15px; border-bottom: 1px solid #21262d; background: #0d1117; text-align: center; }
        .brand-name { font-size: 22px; font-weight: bold; color: #58a6ff; }
        .creator-name { font-size: 12px; color: #8b949e; margin-top: 2px; }
        .main-content { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .welcome-text { text-align: center; color: #8b949e; font-size: 13px; margin-top: 10px; }
        .chat-response { background: #0d1117; border-left: 4px solid #58a6ff; padding: 15px; border-radius: 8px; font-size: 14px; line-height: 1.6; display: none; white-space: pre-wrap; color: #f0f6fc; }
        
        /* आसान बटनों की ग्रिड */
        .direct-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .action-btn { background: #1f242c; border: 1px solid #30363d; color: white; padding: 15px; border-radius: 12px; cursor: pointer; text-align: center; font-size: 14px; font-weight: bold; }
        .action-btn:active { background: #58a6ff; }
    </style>
</head>
<body>

    <div class="phone-container">
        <div class="app-header">
            <div class="brand-name">DesiAI 🚀</div>
            <div class="creator-name">निर्माता: सुलभ कुमार</div>
        </div>

        <div class="main-content" id="mainContent">
            <div class="welcome-text" id="welcomeSection">
                <p style="color: #fff; font-weight: bold; font-size: 15px; margin-bottom: 5px;">सुलभ कुमार का असली महा-बुद्धिमान एआई</p>
                <p>नीचे दिए गए बटनों पर सीधे टच करें, तुरंत बिना रुके सीधा जवाब मिलेगा!</p>
                
                <!-- 🎯 डायरेक्ट क्लिक बटन - टाइप करने का झंझट ही खत्म -->
                <div class="direct-buttons">
                    <button class="action-btn" onclick="showAnswer('शायरी')">🎨 शायरी सुनो</button>
                    <button class="action-btn" onclick="showAnswer('निर्माता')">🥇 निर्माता कौन?</button>
                    <button class="action-btn" onclick="showAnswer('बिहार')">🌾 बिहार का इतिहास</button>
                    <button class="action-btn" onclick="showAnswer('प्रधानमंत्री')">👑 प्रधानमंत्री</button>
                </div>
            </div>
            
            <div class="chat-response" id="aiResponse"></div>
        </div>
    </div>

    <script>
        // 100% पक्का चलने वाला सीधा क्लिक सिस्टम
        function showAnswer(topic) {
            var responseBox = document.getElementById('aiResponse');
            var welcome = document.getElementById('welcomeSection');
            
            welcome.style.display = 'none';
            responseBox.style.display = 'block';
            
            if (topic === 'शायरी') {
                responseBox.innerText = "✨ **दिल खुश करने वाली शायरी:**\n\nसोच को बदल दे जो वो मुकाम हो तुम,\nहर मुश्किल को आसान कर दे वो नाम हो तुम।\nसुलभ जी, इस एआई की दुनिया के असली सुल्तान हो तुम! 👑";
            } 
            else if (topic === 'निर्माता') {
                responseBox.innerText = "🥇 **DesiAI गर्व से कहता है:**\n\nमुझे भारत के बेहतरीन डेवलपर **सुलभ कुमार जी** ने बनाया है। मैं पूरी तरह से उन्हीं का एआई हूँ!";
            } 
            else if (topic === 'बिहार') {
                responseBox.innerText = "🌾 **बिहार राज्य:**\n\nबिहार भारत का एक महान ऐतिहासिक राज्य है जिसकी राजधानी पटना है। यह नालंदा विश्वविद्यालय और महाबोधि मंदिर जैसी महान विरासतों की पावन भूमि है।";
            } 
            else if (topic === 'प्रधानमंत्री') {
                responseBox.innerText = "👑 **भारत के प्रधानमंत्री:**\n\nभारत के प्रथम प्रधानमंत्री पंडित जवाहरलाल नेहरू थे। वर्तमान में भारत के प्रधानमंत्री श्री नरेंद्र मोदी हैं।";
            }
        }
    </script>
</body>
</html>
