<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>मेरा भारत AI</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; }
        .header { background: linear-gradient(to right, #FF9933, #FFFFFF, #128807); text-align: center; padding: 15px; font-size: 20px; font-weight: bold; border-bottom: 2px solid #000080; color: #000080; position: relative; }
        .reset-btn { position: absolute; right: 10px; top: 15px; background: #000080; color: white; border: none; padding: 5px 10px; border-radius: 5px; font-size: 12px; cursor: pointer; }
        .register-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 999; padding: 20px; box-sizing: border-box; }
        .register-screen h2 { color: #FF9933; margin-bottom: 20px; font-size: 24px; text-align: center; }
        .register-screen input { padding: 12px; width: 80%; max-width: 300px; border: 2px solid #128807; border-radius: 25px; font-size: 16px; margin-bottom: 15px; text-align: center; outline: none; }
        .register-screen button { background-color: #128807; color: white; border: none; padding: 12px 30px; border-radius: 25px; font-size: 16px; cursor: pointer; font-weight: bold; }
        .key-area { padding: 10px; background: #fff3cd; border-bottom: 1px solid #ffeeba; display: flex; gap: 10px; align-items: center; justify-content: center; }
        .key-area input { padding: 8px; border: 1px solid #ccc; border-radius: 5px; width: 55%; font-size: 14px; }
        .key-area button { background-color: #000080; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; }
        .chat-container { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 10px 15px; border-radius: 15px; max-width: 80%; word-wrap: break-word; font-size: 16px; }
        .user { background-color: #000080; color: white; align-self: flex-end; }
        .ai { background-color: #ffffff; color: #333; align-self: flex-start; border: 1px solid #ddd; }
        .input-area { padding: 10px; background: white; display: flex; gap: 10px; border-top: 1px solid #ddd; }
        .input-area input { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 25px; font-size: 16px; outline: none; }
        .input-area button { background-color: #128807; color: white; border: none; padding: 12px 20px; border-radius: 25px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="registerScreen" class="register-screen" style="display: none;">
        <h2>🇮🇳 मेरा भारत AI में आपका स्वागत है </h2>
        <p style="font-size: 16px; color: #555;">कृपया आगे बढ़ने के लिए अपना शुभ नाम दर्ज करें:</p>
        <input type="text" id="nameInput" placeholder="यहाँ अपना नाम लिखें...">
        <button onclick="registerUser()">रजिस्टर करें</button>
    </div>
    <div class="header">
        🇮🇳 मेरा भारत AI असिस्टेंट 🇮🇳
        <button class="reset-btn" onclick="resetName()">नाम बदलें</button>
    </div>
    
    <!-- यह बॉक्स अब हमेशा खुला रहेगा जब तक सही चाबी न डाली जाए -->
    <div class="key-area" id="keyArea">
        <label for="apiKeyInput">🔑 Gemini API Key:</label>
        <input type="password" id="apiKeyInput" placeholder="यहाँ नई चाबी पेस्ट करें...">
        <button onclick="saveKey()">सेव</button>
    </div>
    
    <div class="chat-container" id="chatContainer"></div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="यहाँ अपना सवाल लिखें...">
        <button onclick="sendMessage()">भेजें</button>
    </div>
    <script>
        let API_KEY = localStorage.getItem("gemini_api_key") || "";
        let USER_NAME = localStorage.getItem("user_name") || "";
        
        window.onload = function() {
            // स्पेशल रिसेट चेक
            if (window.location.search.includes("reset=true")) {
                localStorage.clear();
                window.location.href = window.location.origin + window.location.pathname;
                return;
            }
            if (!USER_NAME) { document.getElementById("registerScreen").style.display = "flex"; } 
            else { showWelcomeMessage(); }
            
            // अगर पहले से चाबी है तो इनपुट में दिखा दो ताकि यूजर बदल सके
            if (API_KEY) {
                document.getElementById("apiKeyInput").value = API_KEY;
            }
        };
        
        function registerUser() {
            const nameValue = document.getElementById("nameInput").value.trim();
            if (nameValue) {
                localStorage.setItem("user_name", nameValue);
                USER_NAME = nameValue;
                document.getElementById("registerScreen").style.display = "none";
                showWelcomeMessage();
            } else { alert("कृपया पहले अपना नाम लिखें!"); }
        }
        function showWelcomeMessage() {
            const container = document.getElementById("chatContainer");
            container.innerHTML = `<div class="message ai">नमस्ते ${USER_NAME}, वेलकम टू माई एआई! प्रणाम! मैं आपका अपना भारतीय AI दोस्त हूँ। ऊपर अपनी नई चाबी पेस्ट करके 'सेव' दबाएं, फिर नीचे सवाल पूछें।</div>`;
        }
        function resetName() { localStorage.clear(); location.reload(); }
        
        function saveKey() {
            const keyInput = document.getElementById("apiKeyInput").value.trim();
            if(keyInput) {
                localStorage.setItem("gemini_api_key", keyInput);
                API_KEY = keyInput;
                alert("आपकी नई चाबी सेट हो गई है! अब नीचे सवाल पूछें।");
            } else { alert("कृपया सही API Key डालें!"); }
        }
        
        async function sendMessage() {
            if (!API_KEY) { alert("कृपया पहले ऊपर अपनी Gemini API Key डालकर सेव करें!"); return; }
            const inputField = document.getElementById("userInput");
            const userText = inputField.value.trim();
            if (!userText) return;
            appendMessage(userText, 'user');
            inputField.value = "";
            const aiMessageElement = appendMessage("सोच रहा हूँ भाई...", 'ai');
            try {
                const promptText = `तुम भारत के एक सच्चे दोस्त और AI असिस्टेंट हो। यूज़र का नाम ${USER_NAME} है। यूज़र के सवाल का जवाब बहुत ही सरल हिंदी या देसी अंदाज़ में मज़ाक और मुहावरों के साथ दो। कभी-कभी उनके नाम का भी इस्तेमाल करो। यूज़र का सवाल है: ${userText}`;
                const response = await fetch(`https://googleapis.com{API_KEY}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ contents: [{ parts: [{ text: promptText }] }] })
                });
                const data = await response.json();
                if (data.candidates && data.candidates.content.parts.text) {
                    aiMessageElement.innerText = data.candidates.content.parts.text;
                } else { aiMessageElement.innerText = "चाबी (API Key) गलत लग रही है भाई, ऊपर दोबारा सही चाबी डालकर 'सेव' दबाएं!"; }
            } catch (error) { aiMessageElement.innerText = "माफ करना भाई, कुछ गड़बड़ हो गई। ऊपर अपनी सही चाबी दोबारा डालकर 'सेव' बटन दबाएं!"; }
        }
        function appendMessage(text, sender) {
            const container = document.getElementById("chatContainer");
            const messageDiv = document.createElement("div");
            messageDiv.className = `message ${sender}`;
            messageDiv.innerText = text;
            container.appendChild(messageDiv);
            container.scrollTop = container.scrollHeight;
            return messageDiv;
        }
    </script>
</body>
</html>
