<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>मेरा भारत AI असिस्टेंट & HD फोटो टूल</title>

    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: Arial, sans-serif; 
            margin: 0; 
            padding: 0; 
            background-color: #f7f9fb; 
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            flex: 1;
            background-color: #ffffff;
            box-shadow: 0 0 15px rgba(0,0,0,0.05);
        }

        /* तिरंगा ऊपर की पट्टी */
        .top-banner {
            background: linear-gradient(to right, #ff9933 0%, #ff9933 33%, #ffffff 33%, #ffffff 66%, #128807 66%, #128807 100%);
            padding: 12px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid #000080;
        }

        .banner-title {
            font-size: 18px;
            font-weight: bold;
            color: #000080;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .change-name-btn {
            background-color: #000080;
            color: white;
            border: none;
            padding: 6px 12px;
            font-size: 13px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        /* निर्माता क्रेडिट लाइन */
        .creator-text {
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            color: #444444;
            padding: 8px 0;
            background-color: #f9f9f9;
            margin: 0;
            border-bottom: 1px solid #e0e0e0;
        }

        /* मोड बदलने वाला टैब */
        .tab-section {
            display: flex;
            border-bottom: 1px solid #eaeaea;
            background: #fff;
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            text-align: center;
            background: #f8f9fa;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
            color: #555;
            transition: 0.3s;
        }
        .tab-btn.active {
            background: #ffffff;
            color: #000080;
            border-bottom: 3px solid #FF9933;
        }

        /* मुख्य चैट विंडो */
        .chat-window { 
            flex: 1; 
            padding: 15px; 
            overflow-y: auto; 
            background-color: #ffffff; 
            display: flex; 
            flex-direction: column; 
            gap: 15px;
            height: 55vh;
        }

        .msg { 
            padding: 12px 16px; 
            border-radius: 14px; 
            max-width: 80%; 
            font-size: 16px; 
            line-height: 1.4;
        }
        
        .ai-msg { 
            background-color: #ffffff; 
            color: #000000; 
            align-self: flex-start; 
            border: 1px solid #e0e0e0;
        }
        
        .user-msg { 
            background-color: #000080; 
            color: #ffffff; 
            align-self: flex-end; 
        }

        /* फोटो एनहान्सर सेक्शन */
        .photo-section {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            background: #ffffff;
            height: 55vh;
            overflow-y: auto;
        }
        .upload-box {
            border: 2px dashed #b0bec5;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            width: 100%;
            background: #fafafa;
            cursor: pointer;
        }
        .preview-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            width: 100%;
        }
        .preview-img {
            max-width: 100%;
            max-height: 250px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .enhance-btn {
            background-color: #ff9933;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
        }
        .download-btn {
            background-color: #128807;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 5px;
        }

        /* निचला इनपुट हिस्सा */
        .input-section { 
            padding: 15px; 
            display: flex; 
            gap: 10px; 
            align-items: center;
            background-color: #ffffff;
            border-top: 1px solid #eaeaea;
        }

        .chat-input { 
            flex: 1; 
            padding: 12px 20px; 
            border: 1px solid #ccc; 
            border-radius: 25px; 
            font-size: 16px; 
            outline: none;
        }

        .send-btn { 
            background-color: #008000; 
            color: white; 
            border: none; 
            padding: 12px 24px; 
            font-size: 16px; 
            font-weight: bold;
            border-radius: 25px; 
            cursor: pointer;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="container">
        <!-- तिरंगा ऊपर की पट्टी -->
        <div class="top-banner">
            <h2 class="banner-title">🇮🇳 मेरा भारत AI असिस्टेंट 🇮🇳</h2>
            <button id="changeNameBtn" class="change-name-btn">नाम बदलें</button>
        </div>

        <!-- निर्माता क्रेडिट लाइन -->
        <div class="creator-text">इसके निर्माता सुलभ कुमार हैं</div>

        <!-- टैब मेनू -->
        <div class="tab-section">
            <button id="chatTab" class="tab-btn active">💬 AI चैट सहायक</button>
            <button id="photoTab" class="tab-btn">✨ AI फोटो HD मेकर</button>
        </div>

        <!-- 1. चैट विंडो एरिया -->
        <div id="chatWindow" class="chat-window"></div>

        <!-- 2. फोटो एनहान्सर एरिया -->
        <div id="photoSection" class="photo-section hidden">
            <div class="upload-box" onclick="document.getElementById('fileInput').click()">
                <p style="margin:0; color:#555; font-weight:bold;">📸 फोटो अपलोड करने के लिए यहाँ क्लिक करें</p>
                <input type="file" id="fileInput" accept="image/*" style="display:none;">
            </div>
            <div id="previewContainer" class="preview-container hidden">
                <p style="margin:0; font-weight:bold; color:#333;">आपका फोटो:</p>
                <img id="imagePreview" class="preview-img" src="" alt="Preview">
                <button id="enhanceBtn" class="enhance-btn">🪄 AI से फोटो को HD बनाएं</button>
                <button id="downloadBtn" class="download-btn hidden">📥 HD फोटो डाउनलोड करें</button>
            </div>
        </div>

        <!-- चैट का निचला इनपुट हिस्सा -->
        <div id="inputSection" class="input-section">
            <input type="text" id="chatInput" class="chat-input" placeholder="यहाँ अपना सवाल लिखें...">
            <button id="sendBtn" class="send-btn">भेजें</button>
        </div>
    </div>

    <script>

        const sendBtn = document.getElementById('sendBtn');
        const chatWindow = document.getElementById('chatWindow');
        const changeNameBtn = document.getElementById('changeNameBtn');

        const chatTab = document.getElementById('chatTab');
