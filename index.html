<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DesiAI - By Sulabh Kumar</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background-color: #0d1117; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }
        .phone-container { width: 100%; max-width: 400px; height: 90vh; background: #161b22; border-radius: 30px; display: flex; flex-direction: column; overflow: hidden; border: 4px solid #30363d; }
        .app-header { padding: 15px; border-bottom: 1px solid #21262d; background: #0d1117; text-align: center; }
        .brand-name { font-size: 22px; font-weight: bold; color: #58a6ff; }
        .creator-name { font-size: 12px; color: #8b949e; margin-top: 2px; }
        .main-content { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .welcome-text { text-align: center; color: #8b949e; font-size: 13px; margin-top: 10px; }
        .chat-response { background: #0d1117; border-left: 4px solid #58a6ff; padding: 15px; border-radius: 8px; font-size: 14px; line-height: 1.6; display: none; white-space: pre-wrap; color: #f0f6fc; }
        .input-container { padding: 10px; background: #0d1117; border-top: 1px solid #21262d; display: flex; gap: 8px; }
        .prompt-input { flex: 1; background: #161b22; border: 1px solid #30363d; border-radius: 20px; padding: 10px 15px; color: white; font-size: 14px; outline: none; }
        .send-btn { background: #58a6ff; border: none; width: 40px; height: 40px; border-radius: 50%; color: white; font-size: 16px; cursor: pointer; display: flex; justify-content: center; align-items: center; user-select: none; }
    </style>
</head>
<body>

    <div class="phone-container">
        <div class="app-header">
            <div class="brand-name">DesiAI 🚀</div>
            <div class="creator-name">निर्माता: सुलभ कुमार</div>
        </div>

        <div class="main-content" id="mainContent">
            <div class="welcome-text" id="welcomeSection">
                <p style="color: #fff; font-weight: bold; font-size: 15px; margin-bottom: 5px;">सुलभ कुमार का महा-बुद्धिमान एआई</p>
                <p>यहाँ कुछ भी पूछें, बिना किसी फालतू सुझाव के सीधे असली जवाब मिलेगा!</p>
            </div>
            <div class="chat-response" id="aiResponse"></div>
        </div>

        <div class="input-container">
            <input type="text" class="prompt-input" id="userInput" placeholder="यहाँ अपना सवाल लिखें...">
            <button class="send-btn" onclick="askDesiAI()">➔</button>
        </div>
    </div>

    <script>
        function askDesiAI() {
            var inputField = document.getElementById('userInput');
            var responseBox = document.getElementById('aiResponse');
            var welcome = document.getElementById('welcomeSection');
            var prompt = inputField.value.trim();

            if (prompt === "") {
                return;
            }

            welcome.style.display = 'none';
            responseBox.style.display = 'block';
            responseBox.innerText = "🤖 DesiAI उत्तर ढूंढ रहा है...";
            inputField.value = "";

            setTimeout(function() {
                var reply = "";
                var txt = prompt.toLowerCase();

                // 1. निर्माता नियम
                if (txt.indexOf('बनाया') !== -1 || txt.indexOf('निर्माता') !== -1 || txt.indexOf('मालिक') !== -1 || txt.indexOf('creator') !== -1 || txt.indexOf('who made you') !== -1 || txt.indexOf('sulabh') !== -1) {
                    reply = "🥇 **DesiAI गर्व से कहता है:**\n\nमुझे भारत के बेहतरीन डेवलपर **सुलभ कुमार जी** ने बनाया है। मैं सुलभ जी के दिमाग की उपज हूँ और पूरी तरह से उन्हीं का एआई हूँ!";
                } 
                // 2. हाय/नमस्ते का सीधा जवाब
                else if (txt.indexOf('hi') !== -1 || txt.indexOf('hello') !== -1 || txt.indexOf('नमस्ते') !== -1 || txt.indexOf('प्रणाम') !== -1) {
                    reply = "👋 नमस्ते सुलभ जी! DesiAI लाइव मोड में आपका स्वागत करता है। आज मैं आपकी क्या सेवा करूँ?";
                }
                // 3. शायरी का सीधा जवाब
                else if (txt.indexOf('shayri') !== -1 || txt.indexOf('shayari') !== -1 || txt.indexOf('शायरी') !== -1 || txt.indexOf('कविता') !== -1 || txt.indexOf('dil khus') !== -1) {
                    reply = "✨ **दिल खुश करने वाली शायरी:**\n\nसोच को बदल दे जो वो मुकाम हो तुम,\nहर मुश्किल को आसान कर दे वो नाम हो तुम।\nसुलभ जी, इस एआई की दुनिया के असली सुल्तान हो तुम! 👑";
                }
                // 4. प्रधानमंत्री का सीधा जवाब
                else if (txt.indexOf('प्रधानमंत्री') !== -1 || txt.indexOf('pradhanmantri') !== -1 || txt.indexOf('pm') !== -1) {
                    reply = "👑 **भारत के प्रधानमंत्री:**\nभारत के प्रथम प्रधानमंत्री पंडित जवाहरलाल नेहरू थे। वर्तमान में भारत के प्रधानमंत्री श्री नरेंद्र मोदी हैं।";
                }
                // 5. बिहार का सीधा जवाब
                else if (txt.indexOf('bihar') !== -1 || txt.indexOf('बिहार') !== -1) {
                    reply = "🌾 **बिहार राज्य:**\nबिहार भारत का एक महान ऐतिहासिक राज्य है जिसकी राजधानी पटना है। यह नालंदा विश्वविद्यालय और महाबोधि मंदिर जैसी महान विरासतों की भूमि है।";
                }
                // 6. राजधानी का सीधा जवाब
                else if (txt.indexOf('rajdhani') !== -1 || txt.indexOf('राजधानी') !== -1) {
                    reply = "📍 **राजधानी:**\nभारत की राजधानी नई दिल्ली है। बिहार की राजधानी पटना है, और उत्तर प्रदेश की राजधानी लखनऊ है।";
                }
                // 7. गणित का सीधा हल (जोड़, घटाव, गुणा सब तुरंत काम करेगा)
                else {
                    var cleanMath = prompt.replace(/ कितना होता है| कितना होगा|\?/g, '').replace(/\s+/g, '');
                    if (/^[0-9\+\-\*\/\(\)\.]+$/.test(cleanMath)) {
                        try {
                            var result = Function('"use strict";return (' + cleanMath + ')')();
                            reply = "🔢 **गणित समाधान:**\n\nआपके सवाल का सही जवाब है: **" + result + "**";
                        } catch (e) {
                            reply = "🚀 **DesiAI उत्तर:**\n\nकृपया सवाल को सीधे और साफ़ शब्दों में लिखें।";
                        }
                    } else {
                        // 8. अन्य सभी सवालों का सीधा और साफ उत्तर
                        reply = "🚀 **DesiAI लाइव उत्तर:**\n\nसुलभ जी, इस विषय पर डेटाबेस पूरी तरह सक्रिय है। आप 'बिहार', 'प्रधानमंत्री', 'मुख्यमंत्री', 'राजधानी', 'शायरी' या कोई भी गणितीय हिसाब पूछें, तुरंत सीधा उत्तर मिलेगा!";
                    }
                }

                // सीधे केवल और केवल उत्तर स्क्रीन पर दिखाना
                responseBox.innerText = reply;
            }, 200);
        }
    </script>
</body>
</html>
