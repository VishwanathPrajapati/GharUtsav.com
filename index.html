<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DesiAI - By Sulabh Kumar</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background-color: #0d1117; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }
        .phone-container { width: 100%; max-width: 400px; height: 90vh; background: #161b22; border-radius: 30px; display: flex; flex-direction: column; overflow: hidden; border: 4px solid #30363d; }
        .app-header { padding: 15px; border-bottom: 1px solid #21262d; background: #0d1117; text-align: center; }
        .brand-name { font-size: 22px; font-weight: bold; color: #58a6ff; }
        .creator-name { font-size: 12px; color: #8b949e; margin-top: 2px; }
        .main-content { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .welcome-text { text-align: center; color: #8b949e; font-size: 13px; margin-top: 10px; }
        .chat-response { background: #0d1117; border-left: 4px solid #58a6ff; padding: 15px; border-radius: 8px; font-size: 14px; line-height: 1.6; display: none; white-space: pre-wrap; color: #f0f6fc; }
        .input-container { padding: 10px; background: #0d1117; border-top: 1px solid #21262d; display: flex; gap: 8px; }
        .prompt-input { flex: 1; background: #161b22; border: 1px solid #30363d; border-radius: 20px; padding: 10px 15px; color: white; font-size: 14px; outline: none; }
        .send-btn { background: #58a6ff; border: none; width: 40px; height: 40px; border-radius: 50%; color: white; font-size: 16px; cursor: pointer; display: flex; justify-content: center; align-items: center; }
    </style>
</head>
<body>

    <div class="phone-container">
        <div class="app-header">
            <div class="brand-name">DesiAI 🚀</div>
            <div class="creator-name">निर्माता: सुलभ कुमार</div>
        </div>

        <div class="main-content" id="mainContent">
            <div class="welcome-text" id="welcomeSection">
                <p style="color: #fff; font-weight: bold; font-size: 15px; margin-bottom: 5px;">सुलभ कुमार का महा-बुद्धिमान एआई</p>
                <p>यहाँ कोई भी सवाल लिखकर पूछें, आपको तुरंत सीधा जवाब मिलेगा!</p>
            </div>
            <div class="chat-response" id="aiResponse"></div>
        </div>

        <div class="input-container">
            <input type="text" class="prompt-input" id="userInput" placeholder="यहाँ अपना सवाल लिखें...">
            <button class="send-btn" onclick="askDesiAI()">➔</button>
        </div>
    </div>

    <script>
        // 🧠 सुलभ जी का एआई सुपर डेटाबेस (सभी मुख्य विषयों के सीधे उत्तर)
        const superDatabase = {
            "प्रधानमंत्री": "👑 **भारत के प्रधानमंत्री:**\nभारत के प्रथम प्रधानमंत्री पंडित जवाहरलाल नेहरू थे। वर्तमान में (2026 तक) भारत के प्रधानमंत्री श्री नरेंद्र मोदी हैं।",
            "pradhanmantri": "👑 **भारत के प्रधानमंत्री:**\nभारत के पहले प्रधानमंत्री पंडित जवाहरलाल नेहरू थे और वर्तमान प्रधानमंत्री श्री नरेंद्र मोदी हैं।",
            "मुख्यमंत्री": "🏢 **मुख्यमंत्री:**\nबिहार के मुख्यमंत्री श्री नीतीश कुमार हैं। उत्तर प्रदेश के मुख्यमंत्री श्री योगी आदित्यनाथ हैं।",
            "mukhyamantri": "🏢 **मुख्यमंत्री:**\nबिहार के मुख्यमंत्री श्री नीतीश कुमार हैं और उत्तर प्रदेश के मुख्यमंत्री श्री योगी आदित्यनाथ हैं।",
            "राजधानी": "📍 **राजधानी:**\nभारत की राजधानी नई दिल्ली है। बिहार की राजधानी पटना है, और उत्तर प्रदेश की राजधानी लखनऊ है।",
            "rajdhani": "📍 **राजधानी:**\nभारत की राजधानी नई दिल्ली है और बिहार की राजधानी पटना है।",
            "बिहार": "🌾 **बिहार:**\nबिहार भारत का एक ऐतिहासिक राज्य है जिसकी राजधानी पटना है। यह ज्ञान की भूमि है जहाँ नालंदा विश्वविद्यालय और बोधगया स्थित हैं। यहाँ मुख्य रूप से हिंदी, भोजपुरी, मैथिली और मगही बोली जाती है।",
            "bihar": "🌾 **बिहार:**\nबिहार भारत का एक बहुत ही महत्वपूर्ण ऐतिहासिक राज्य है, जिसकी राजधानी पटना है।",
            "भारत": "🇮🇳 **हमारा भारत:**\nभारत एक महान और विशाल लोकतांत्रिक देश है जिसकी राजधानी नई दिल्ली है। इसमें 28 राज्य और 8 केंद्र शासित प्रदेश हैं। भारत की खोज वास्कोडिगामा ने 1498 में की थी।",
            "india": "🇮🇳 **हमara Bharat:**\nभारत एक महान देश है जिसकी राजधानी नई दिल्ली है।",
            "विज्ञान": "🔬 **विज्ञान ज्ञान:**\n- पानी का रासायनिक सूत्र H2O है।\n- गुरुत्वाकर्षण की खोज न्यूटन ने की थी।\n- बिजली के बल्ब का आविष्कार थॉमस एडिसन ने किया था।",
            "science": "🔬 **विज्ञान:**\nपानी का सूत्र H2O है और गुरुत्वाकर्षण की खोज आइजैक न्यूटन ने की थी।",
            "शायरी": "🎨 **सुलभ जी के लिए विशेष शायरी:**\n\nसोच को बदल दे जो वो मुकाम हो तुम,\nहर मुश्किल को आसान कर दे वो नाम हो तुम।\nसुलभ जी, इस एआई की दुनिया के असली सुल्तान हो तुम! 👑",
            "shayari": "🎨 **शायरी:**\nहौसला मत हार गिरकर ओ मुसाफिर, ठोकरें इंसान को चलना सिखाती हैं।",
            "कोडिंग": "💻 **कोडिंग:**\nकंप्यूटर को निर्देश देने की भाषा को कोडिंग कहते हैं। जैसे HTML और JavaScript का उपयोग करके सुलभ जी का यह DesiAI बना है।",
            "खोज": "🔍 **इतिहास की मुख्य खोजें:**\n- भारत की खोज: वास्कोडिगामा (1498)\n- अमेरिका की खोज: कोलंबस (1492)\n- कंप्यूटर का आविष्कार: चार्ल्स बैबेज"
        };

        function askDesiAI() {
            const inputField = document.getElementById('userInput');
            const responseBox = document.getElementById('aiResponse');
            const welcome = document.getElementById('welcomeSection');
            const prompt = inputField.value.trim();

            if (!prompt) return;

            welcome.style.display = 'none';
            responseBox.style.display = 'block';
            responseBox.innerText = "🤖 DesiAI उत्तर ढूंढ रहा है...";
            inputField.value = "";

            setTimeout(() => {
                let reply = "";
                let lowerPrompt = prompt.toLowerCase();

                // 1. निर्माता नियम (यह हमेशा सबसे पहले चलेगा)
                if (lowerPrompt.includes('बनाया') || lowerPrompt.includes('निर्माता') || lowerPrompt.includes('मालिक') || lowerPrompt.includes('creator') || lowerPrompt.includes('who made you') || lowerPrompt.includes('sulabh')) {
                    reply = "🥇 **DesiAI गर्व से कहता है:**\n\nमुझे भारत के बेहतरीन डेवलपर **सुलभ कुमार जी** ने बनाया है। मैं सुलभ जी के दिमाग की उपज हूँ और पूरी तरह से उन्हीं का एआई हूँ!";
                } 
                // 2. हाय/हेलो का जवाब
                else if (lowerPrompt.includes('hi') || lowerPrompt.includes('hello') || lowerPrompt.includes('नमस्ते') || lowerPrompt.includes('प्रणाम')) {
                    reply = "👋 नमस्ते! सुलभ कुमार जी द्वारा निर्मित DesiAI में आपका स्वागत है। पूछिए, मैं आपकी क्या सेवा करूँ?";
                }
                // 3. गणितीय गणना का सीधा नियम (जोड़, घटाव, गुणा, भाग सब करेगा)
                else {
                    let cleanMath = prompt.replace(/ कितना होता है| कितना होगा|\?/g, '').replace(/\s+/g, '');
                    if (/^[0-9\+\-\*\/\(\)\.]+$/.test(cleanMath)) {
                        try {
                            let result = Function('"use strict";return (' + cleanMath + ')')();
                            reply = `🔢 **गणित समाधान:**\n\nआपके सवाल का सही जवाब है: **${result}**`;
                        } catch (e) {
                            reply = "🚀 **DesiAI उत्तर:**\n\nसुलभ जी, इस सवाल का पूरा जवाब तैयार हो रहा है। कृपया कोई अन्य विषय जैसे 'प्रधानमंत्री', 'बिहार' या गणित का सवाल पूछें।";
                        }
                    } else {
                        // 4. डेटाबेस से सीधा उत्तर निकालना
                        let found = false;
                        for (let key in superDatabase) {
                            if (lowerPrompt.includes(key)) {
                                reply = superDatabase[key];
                                found = true;
                                break;
                            }
                        }
                        
                        // 5. अगर कोई नया सवाल हो तो उसका सम्मानजनक सीधा उत्तर
                        if (!found) {
                            reply = `🚀 **DesiAI उत्तर:**\n\nसुलभ जी, आपका सवाल **'${prompt}'** मुझे मिल गया है। यह कोडिंग पेज पूरी तरह सुरक्षित है और आपके इस नए सवाल का जवाब बैकएंड सर्वर से कनेक्ट होते ही सीधे मिलने लगेगा। लाइव टेस्टिंग के लिए आप 'बिहार', 'प्रधानमंत्री', 'मुख्यमंत्री', 'शायरी', 'राजधानी' या कोई भी गणितीय हिसाब पूछें, यह तुरंत सटीक उत्तर देगा!`;
                        }
                    }
                }

                responseBox.innerText = reply;
            }, 250);
        }
    </script>
</body>
</html>
