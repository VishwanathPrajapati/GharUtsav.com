<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DesiAI - By Sulabh Kumar</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background-color: #0d1117; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }
        .phone-container { width: 100%; max-width: 400px; height: 90vh; background: #161b22; border-radius: 30px; display: flex; flex-direction: column; overflow: hidden; border: 4px solid #30363d; }
        .app-header { padding: 15px; border-bottom: 1px solid #21262d; background: #0d1117; text-align: center; }
        .brand-name { font-size: 22px; font-weight: bold; color: #58a6ff; }
        .creator-name { font-size: 12px; color: #8b949e; margin-top: 2px; }
        .main-content { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .welcome-text { text-align: center; color: #8b949e; font-size: 13px; margin-top: 10px; }
        .chat-response { background: #0d1117; border-left: 4px solid #58a6ff; padding: 15px; border-radius: 8px; font-size: 14px; line-height: 1.6; display: none; white-space: pre-wrap; color: #f0f6fc; }
        .input-container { padding: 10px; background: #0d1117; border-top: 1px solid #21262d; display: flex; gap: 8px; }
        .prompt-input { flex: 1; background: #161b22; border: 1px solid #30363d; border-radius: 20px; padding: 10px 15px; color: white; font-size: 14px; outline: none; }
        .send-btn { background: #58a6ff; border: none; width: 40px; height: 40px; border-radius: 50%; color: white; font-size: 16px; cursor: pointer; display: flex; justify-content: center; align-items: center; }
    </style>
</head>
<body>

    <div class="phone-container">
        <div class="app-header">
            <div class="brand-name">DesiAI 🚀</div>
            <div class="creator-name">निर्माता: सुलभ कुमार</div>
        </div>

        <div class="main-content" id="mainContent">
            <div class="welcome-text" id="welcomeSection">
                <p style="color: #fff; font-weight: bold; font-size: 15px; margin-bottom: 5px;">सुलभ कुमार का असली सुपर एआई</p>
                <p>यहाँ कुछ भी पूछें, तुरंत सीधा और सटीक उत्तर मिलेगा!</p>
            </div>
            <div class="chat-response" id="aiResponse"></div>
        </div>

        <div class="input-container">
            <input type="text" class="prompt-input" id="userInput" placeholder="यहाँ अपना सवाल लिखें...">
            <button class="send-btn" onclick="askDesiAI()">➔</button>
        </div>
    </div>

    <script>
        function askDesiAI() {
            const inputField = document.getElementById('userInput');
            const responseBox = document.getElementById('aiResponse');
            const welcome = document.getElementById('welcomeSection');
            const prompt = inputField.value.trim();

            if (!prompt) return;

            welcome.style.display = 'none';
            responseBox.style.display = 'block';
            responseBox.innerText = "🤖 सोच रहा है...";
            inputField.value = "";

            setTimeout(() => {
                let reply = "";
                let txt = prompt.toLowerCase();

                // 1. निर्माता का सीधा जवाब
                if (txt.includes('बनाया') || txt.includes('निर्माता') || txt.includes('मालिक') || txt.includes('creator') || txt.includes('who made you')) {
                    reply = "🥇 मुझे गर्व है कि मुझे महान भारतीय डेवलपर सुलभ कुमार जी ने बनाया है! मैं पूरी तरह से सुलभ जी का ही एआई (DesiAI) हूँ।";
                } 
                // 2. शायरी का सीधा जवाब (चाहे हिंग्लिश में पूछे या हिंदी में)
                else if (txt.includes('shayri') || txt.includes('shayari') || txt.includes('शायरी') || txt.includes('कविता')) {
                    reply = "🎨 **दिल खुश करने वाली शायरी:**\n\nसितारों से आगे जहाँ और भी हैं,\nअभी इश्क के इम्तिहाँ और भी हैं।\nतुम गिरो तो संभालने वाले सुलभ कुमार हैं,\nइस एआई की दुनिया के असली हकदार हैं।";
                }
                // 3. प्रधानमंत्री का सीधा जवाब
                else if (txt.includes('pradhanmantri') || txt.includes('प्रधानमंत्री') || txt.includes('pm')) {
                    reply = "👑 भारत के प्रथम प्रधानमंत्री पंडित जवाहरलाल नेहरू थे। वर्तमान में भारत के प्रधानमंत्री श्री नरेंद्र मोदी हैं।";
                }
                // 4. मुख्यमंत्री का सीधा जवाब
                else if (txt.includes('mukhyamantri') || txt.includes('मुख्यमंत्री')) {
                    reply = "🏢 बिहार के वर्तमान मुख्यमंत्री श्री नीतीश कुमार हैं और उत्तर प्रदेश के मुख्यमंत्री श्री योगी आदित्यनाथ हैं।";
                }
                // 5. बिहार का सीधा जवाब
                else if (txt.includes('bihar') || txt.includes('बिहार')) {
                    reply = "🌾 बिहार भारत का एक महान ऐतिहासिक राज्य है, जिसकी राजधानी पटना है। यह ज्ञान और अध्यात्म की भूमि है।";
                }
                // 6. राजधानी का सीधा जवाब
                else if (txt.includes('rajdhani') || txt.includes('राजधानी')) {
                    reply = "📍 भारत की राजधानी नई दिल्ली है और बिहार की राजधानी पटना है।";
                }
                // 7. गणित का सीधा जवाब
                else {
                    let math = prompt.replace(/ कितना होता है| कितना होगा|\?/g, '').replace(/\s+/g, '');
                    if (/^[0-9\+\-\*\/\(\)\.]+$/.test(math)) {
                        try {
                            reply = Function('"use strict";return (' + math + ')')();
                        } catch (e) {
                            reply = "सुलभ जी, कृपया सवाल दोबारा साफ लिखें।";
                        }
                    } else {
                        // हर दूसरे सवाल का बिना किसी सुझाव के सीधा और सरल जवाब
                        reply = "🚀 आपका सवाल मिल गया है। यह सुलभ कुमार जी का एआई है। लाइव रिस्पॉन्स के लिए आप 'शायरी', 'प्रधानमंत्री', 'बिहार' या कोई भी गणित पूछें, तुरंत उत्तर मिलेगा।";
                    }
                }

                // सीधे सिर्फ उत्तर छापना
                responseBox.innerText = reply;
            }, 200);
        }
    </script>
</body>
</html>
