<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DesiAI - By Sulabh Kumar</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0d1117; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }
        .phone-container { width: 100%; max-width: 400px; height: 90vh; background: #161b22; border-radius: 30px; display: flex; flex-direction: column; overflow: hidden; border: 4px solid #30363d; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        .app-header { padding: 15px; border-bottom: 1px solid #21262d; background: #0d1117; text-align: center; }
        .brand-name { font-size: 24px; font-weight: bold; color: #58a6ff; letter-spacing: 1px; }
        .creator-name { font-size: 12px; color: #8b949e; margin-top: 2px; font-style: italic; }
        .main-content { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .welcome-text { text-align: center; color: #8b949e; font-size: 13px; margin-top: 15px; line-height: 1.5; }
        .chat-response { background: #0d1117; border-left: 4px solid #58a6ff; padding: 15px; border-radius: 8px; font-size: 14px; line-height: 1.6; display: none; white-space: pre-wrap; color: #f0f6fc; }
        .input-container { padding: 12px; background: #0d1117; border-top: 1px solid #21262d; display: flex; gap: 8px; align-items: center; }
        .prompt-input { flex: 1; background: #161b22; border: 1px solid #30363d; border-radius: 20px; padding: 10px 15px; color: white; font-size: 14px; outline: none; }
        .prompt-input:focus { border-color: #58a6ff; }
        .send-btn { background: #58a6ff; border: none; width: 42px; height: 42px; border-radius: 50%; color: white; font-size: 18px; cursor: pointer; display: flex; justify-content: center; align-items: center; user-select: none; -webkit-user-select: none; }
        .send-btn:hover { background: #1f6feb; }
    </style>
</head>
<body>

    <div class="phone-container">
        <!-- ऐप हेडर -->
        <div class="app-header">
            <div class="brand-name">DesiAI 🚀</div>
            <div class="creator-name">निर्माता: सुलभ कुमार</div>
        </div>

        <!-- मुख्य स्क्रीन -->
        <div class="main-content" id="mainContent">
            <div class="welcome-text" id="welcomeSection">
                <p style="color: #fff; font-weight: bold; font-size: 16px; margin-bottom: 6px;">सुलभ कुमार का महा-बुद्धिमान एआई</p>
                <p>यहाँ इतिहास, भूगोल, विज्ञान, बिहार, शायरी या कोई भी सवाल लिखकर पूछें, तुरंत सीधा जवाब मिलेगा!</p>
            </div>
            <div class="chat-response" id="aiResponse"></div>
        </div>

        <!-- इनपुट एरिया -->
        <div class="input-container">
            <input type="text" class="prompt-input" id="userInput" placeholder="यहाँ अपना सवाल लिखें...">
            <button class="send-btn" onclick="askDesiAI()">➔</button>
        </div>
    </div>

        let currentShayariCounter = 0;

        function askDesiAI() {
            var inputField = document.getElementById('userInput');
            var responseBox = document.getElementById('aiResponse');
            var welcome = document.getElementById('welcomeSection');
            var prompt = inputField.value.trim();

            if (prompt === "") {
                return;
            }

            // स्क्रीन से वेलकम मैसेज तुरंत हटाना
            welcome.style.display = 'none';
            responseBox.style.display = 'block';
            responseBox.innerText = "🤖 DesiAI सोच रहा है...";
            inputField.value = "";

            setTimeout(function() {
                var reply = "";
                var txt = prompt.toLowerCase();

                // 1. निर्माता नियम (यह हमेशा सुलभ कुमार जी का नाम सबसे ऊपर दिखाएगा)

                } 
                // 2. हाय/नमस्ते का सीधा जवाब
                else if (txt.indexOf('hi') !== -1 || txt.indexOf('hello') !== -1 || txt.indexOf('नमस्ते') !== -1 || txt.indexOf('प्रणाम') !== -1 || txt.indexOf('हाय') !== -1) {

                }
