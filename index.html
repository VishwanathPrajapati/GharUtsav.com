<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Sulabh AI</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <!-- HEADER -->
    <header class="header">

      <div>
        <h1>🤖 Sulabh AI</h1>

        <p>
          AI Assistant • Created by Sulabh Kumar
        </p>
      </div>

      <button id="clearBtn">
        Clear
      </button>

    </header>


    <!-- CHAT AREA -->
    <main id="chatBox">

      <div class="message ai">
        नमस्ते! 👋
        मैं Sulabh AI हूँ।

        आप मुझसे कुछ भी पूछ सकते हैं।
      </div>

    </main>


    <!-- LOADING -->
    <div
      id="loading"
      class="loading hidden"
    >
      AI सोच रहा है...
    </div>


    <!-- INPUT -->
    <form id="chatForm">

      <textarea
        id="prompt"
        placeholder="अपना सवाल लिखें..."
        required
      ></textarea>

      <button
        id="sendBtn"
        type="submit"
      >
        ➤
      </button>

    </form>


    <!-- FOOTER -->
    <footer>
      © 2026 Sulabh Kumar
    </footer>

  </div>


  <script src="script.js"></script>

</body>
</html>
